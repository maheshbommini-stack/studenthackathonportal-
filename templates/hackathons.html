    href="css/style.css"
>

    rel="stylesheet"
    href="css/responsive.css"
>

</head><body><!-- ================= NAVBAR ================= --><nav class="navbar"><a
    href="index.html"
    class="brand"
>
    ⚡ HackArena
</a>


<div class="navlinks">

    <a href="index.html">
        Home
    </a>

    <a
        href="hackathons.html"
        class="active"
    >

    <a href="leaderboard.html">

    <a href="dashboard.html">

    </a>

    <a

        class="nav-btn"
    >
        Login
    </a>

</div>


<button
    class="menu"
    onclick="toggleMenu()"
>
    ☰
</button>

</nav><!-- ================= MAIN ================= --><main class="container"><!-- PAGE TITLE -->

<div class="page-title">

    <span class="eyebrow">
        COMPETE & CREATE
    </span>

    <h1>
        Explore Hackathons
    </h1>

    <p>
        Find your next challenge, build a team
        and turn your ideas into reality.
    </p>

</div>



<!-- ================= FILTERS ================= -->

<div class="filters">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search hackathons..."
        oninput="renderHackathons()"
    >


    <select
        id="category"
        onchange="renderHackathons()"
    >

        <option value="all">
            All Categories
        </option>

        <option value="AI">
            Artificial Intelligence
        </option>

        <option value="Web">
            Web Development
        </option>

        <option value="Cybersecurity">
            Cybersecurity
        </option>

        <option value="Cloud">
            Cloud Computing
        </option>

        <option value="GreenTech">
            GreenTech
        </option>

    </select>


    <select
        id="status"
        onchange="renderHackathons()"
    >

        <option value="all">
            All Status
        </option>

        <option value="Open">
            Open
        </option>

        <option value="Upcoming">
            Upcoming
        </option>

    </select>

</div>



<!-- ================= RESULTS ================= -->

<div
    class="grid"
    id="hackathonGrid"
>

    <!-- JavaScript cards appear here -->

</div>
